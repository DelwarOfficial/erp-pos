# docker/docker-compose.prod.yml — one-VPS production stack.
#
#   caddy    reverse proxy, automatic HTTPS (Let's Encrypt) for $APP_DOMAIN
#   web      Next.js app (docker/Dockerfile.web, target runner)
#   worker   BullMQ workers: outbox, daily reconciliation + risk alerts, SMS
#   migrate  one-shot: prisma migrate deploy (run on purpose, never automatically)
#   mariadb  MariaDB 11.8, binary log on, Asia/Dhaka time, not published to the host
#   redis    Redis 7 with a password and append-only file, not published
#
# Every secret comes from docker/.env.prod (see docker/.env.prod.example and
# scripts/deploy/gen-secrets.sh). Nothing here has a default secret: a missing
# value fails the start instead of running with a known one.
#
# Runbook: docs/runbooks/vps-deploy.md
#
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d mariadb redis
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod run --rm migrate
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d web worker caddy

name: erp-pos

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: mysql://${DB_USER:?}:${DB_PASSWORD:?}@mariadb:3306/${DB_NAME:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
  BARCODE_SIGNING_KEY: ${BARCODE_SIGNING_KEY:?}
  CRON_API_TOKEN: ${CRON_API_TOKEN:?}
  WEBAUTHN_RP_ID: ${APP_DOMAIN:?}
  WEBAUTHN_ORIGIN: https://${APP_DOMAIN:?}
  # Optional integrations (SMS is set per company in the app; these are provider keys).
  SENTRY_DSN: ${SENTRY_DSN:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  RISK_ALERT_RECIPIENT_EMAIL: ${RISK_ALERT_RECIPIENT_EMAIL:-}
  TZ: Asia/Dhaka

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?}
      # This user gets privileges on DB_NAME only (not server-wide).
      MARIADB_USER: ${DB_USER:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      TZ: Asia/Dhaka
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+06:00
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-1G}
      # Point-in-time recovery between nightly dumps.
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800
      # Migrations create triggers as the app user (not root) with the binary log on.
      - --log-bin-trust-function-creators=1
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [backend]

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: tools
    image: erp-pos-tools:${APP_VERSION:-latest}
    profiles: [tools]
    environment:
      DATABASE_URL: mysql://${DB_USER:?}:${DB_PASSWORD:?}@mariadb:3306/${DB_NAME:?}
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/mariadb/schema.prisma"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: runner
    image: erp-pos-web:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [backend, frontend]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: erp-pos-worker:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # frontend gives outbound internet (SMS, courier and payment providers); no ports are published.
    networks: [backend, frontend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  mariadb-data:
  redis-data:
  caddy-data:
  caddy-config:
