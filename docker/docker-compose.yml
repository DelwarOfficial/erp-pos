# docker/docker-compose.yml
# Local development: MariaDB 11.8 (the production database), Redis, MinIO (S3-compatible).
#
# This used to start PostgreSQL 16, which the app no longer runs on: the Prisma
# schema is prisma/mariadb/schema.prisma (package.json "prisma.schema") and the
# migrations in prisma/mariadb/migrations are MariaDB SQL.
#
# First start, then apply migrations from the host:
#   docker compose -f docker/docker-compose.yml up -d mariadb redis minio
#   DATABASE_URL="mysql://app:app_password_dev@127.0.0.1:3306/erp_pos" npx prisma migrate deploy
#
# The passwords below are development defaults only. Production refuses to
# start with published or placeholder secrets (src/lib/config/productionGuards.ts).

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: erp_pos
      MARIADB_USER: app
      MARIADB_PASSWORD: ${APP_DB_PASSWORD:-app_password_dev}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password_dev}
    # The app sets each transaction's isolation level itself (src/lib/db/transaction.ts).
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://app:${APP_DB_PASSWORD:-app_password_dev}@mariadb:3306/erp_pos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-dev-encryption-key}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: mysql://app:${APP_DB_PASSWORD:-app_password_dev}@mariadb:3306/erp_pos
      REDIS_URL: redis://redis:6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadbdata:
  redisdata:
  miniodata:
